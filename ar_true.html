<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR 掃描｜新勢公園 AI 自然偵探</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110d;color:#fff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#sceneHost{position:fixed;inset:0}
.overlay{position:fixed;inset:0;z-index:20;pointer-events:none}
.top{position:absolute;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
.ref{width:86px;height:86px;object-fit:cover;border:2px solid rgba(255,255,255,.88);border-radius:15px;box-shadow:0 8px 24px rgba(0,0,0,.42)}
.head{flex:1;background:rgba(5,20,13,.75);backdrop-filter:blur(12px);padding:10px 12px;border-radius:15px}
.title{font-weight:950;font-size:17px}.sub{font-size:13px;line-height:1.5;opacity:.9;margin-top:4px}
.bottom{position:absolute;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;gap:8px;pointer-events:auto}
.status{background:rgba(5,20,13,.80);backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;text-align:center;font-weight:850;line-height:1.5;border:1px solid rgba(255,255,255,.16)}
.btn{border:0;border-radius:15px;padding:14px 16px;font:inherit;font-size:16px;font-weight:950;cursor:pointer}
.done{background:#59a67d;color:#fff;display:none}.back{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2)}
#errorBox{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#0b2118,#092019 55%,#13281d);display:none;align-items:center;justify-content:center;padding:22px}
#errorBox.show{display:flex}.errCard{max-width:430px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:24px 20px;text-align:center}
.errCard a{display:block;margin-top:12px;background:#e5b958;color:#332606;text-decoration:none;padding:13px;border-radius:14px;font-weight:950}
a-scene{position:fixed!important;inset:0!important}
</style>
</head>
<body>
<div id="sceneHost"></div>
<div class="overlay">
  <div class="top"><img id="ref" class="ref"><div class="head"><div id="title" class="title"></div><div class="sub">把鏡頭對準照片中的現場景物。辨識成功後，AR 圖騰才會浮出來。</div></div></div>
  <div class="bottom"><div id="status" class="status">正在確認 AR 資料…</div><button id="doneBtn" class="btn done">辨識成功，回到任務</button><button class="btn back" onclick="history.back()">返回上一頁</button></div>
</div>
<div id="errorBox"><div class="errCard"><h2>AR 尚未完成設定</h2><p>網站裡還沒有 <b>assets/targets.mind</b>。請先依「AR設定說明」把三張目標照片編譯成 targets.mind，再上傳到 assets 資料夾。</p><a href="ar_setup.html">查看 AR 設定說明</a></div></div>

<script>
const q=new URLSearchParams(location.search), target=q.get('target')||'demo', ret=q.get('return')||'index.html';
const C={
 demo:{idx:0,title:'示範 AR｜彩色裝置',img:'assets/demo_ar.webp',art:'assets/ar_art_demo.svg',msg:'✨ 辨識成功！彩色水流圖騰被喚醒了。'},
 water:{idx:1,title:'正式 AR｜水質淨化區',img:'assets/ar_water.webp',art:'assets/ar_art_water.svg',msg:'💧 辨識成功！水滴守護者與魚形水紋出現了。'},
 river:{idx:2,title:'正式 AR｜老街溪河川教育中心',img:'assets/ar_river.webp',art:'assets/ar_art_river.svg',msg:'🌊 辨識成功！老街溪的水滴河紋甦醒了。'}
}[target];
document.getElementById('ref').src=C.img;
document.getElementById('title').textContent=C.title;
document.getElementById('doneBtn').onclick=()=>location.href=decodeURIComponent(ret);

async function boot(){
  try{
    const r=await fetch('assets/targets.mind',{cache:'no-store'});
    if(!r.ok) throw new Error('missing targets.mind');
    document.getElementById('status').textContent='AR 已就緒，請對準指定景點。';
  }catch(e){
    document.getElementById('errorBox').classList.add('show');
    return;
  }
  const host=document.getElementById('sceneHost');
  host.innerHTML=`
    <a-scene mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes;"
      color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
      <a-assets><img id="art" src="${C.art}"></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="anchor" mindar-image-target="targetIndex: ${C.idx}">
        <a-ring color="#9ff7e2" radius-inner="0.48" radius-outer="0.51" position="0 0 0.02"
          material="opacity: 0.75; transparent: true"
          animation="property: rotation; to: 0 0 360; loop: true; dur: 9000; easing: linear"></a-ring>
        <a-image src="#art" position="0 0 0.06" width="1.05" height="1.05"
          material="transparent: true; alphaTest: 0.04"
          animation="property: scale; from: 0.88 0.88 0.88; to: 1 1 1; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"></a-image>
      </a-entity>
    </a-scene>`;
  setTimeout(()=>{
    const anchor=document.getElementById('anchor');
    if(!anchor) return;
    anchor.addEventListener('targetFound',()=>{
      document.getElementById('status').textContent=C.msg;
      document.getElementById('doneBtn').style.display='block';
      localStorage.setItem('xinshi_ar_'+target,'done');
    });
    anchor.addEventListener('targetLost',()=>{
      if(localStorage.getItem('xinshi_ar_'+target)==='done'){
        document.getElementById('status').textContent='✅ 已辨識成功，可以回到任務繼續。';
      }else{
        document.getElementById('status').textContent='還沒辨識到，請慢慢移動手機，讓景物完整進入畫面。';
      }
    });
  },900);
}
boot();
</script>
</body></html>
